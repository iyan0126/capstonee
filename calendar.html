<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Calendar Widget</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 8px; 
      background: transparent;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar-container {
      background-color: #FAD376; 
      border: 2px solid #000000; 
      border-radius: 26px;
      padding: 14px 20px; 
      width: 100%;
      max-width: 550px;
      box-sizing: border-box;
      user-select: none;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .month-year {
      font-size: 16px; 
      font-weight: 900; 
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 20px; 
      font-weight: 900;
      color: #000000;
      cursor: pointer;
      padding: 0 8px;
      transition: transform 0.1s ease;
    }

    .nav-btn:active {
      transform: scale(0.85);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 3px; 
    }

    .day-label {
      font-size: 16px; 
      font-weight: 900;
      color: #423c2f; 
      margin-bottom: 4px; 
      text-transform: uppercase; 
    }

    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 60px; 
    }

    .date-number {
      font-size: 17px; 
      font-weight: 800;
      color: #3a505f;
      z-index: 2;
    }

    .day-cell.active {
      background-color: #3a505f; 
      border: 1px solid #000000;
      border-radius: 12px; 
    }

    .day-cell.active .date-number {
      color: #FFFFFF; 
    }

    .dot-indicator {
      width: 4.5px; 
      height: 4.5px;
      background-color: #FFFFFF;
      border-radius: 50%;
      margin-top: 3px; 
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <button class="nav-btn" onclick="changeWeek(-1)">&lt;</button>
      <div id="monthYearHeader" class="month-year">August 2026</div>
      <button class="nav-btn" onclick="changeWeek(1)">&gt;</button>
    </div>
    
    <div class="week-grid" id="weekGrid">
      <!-- Generated dynamically by the script -->
    </div>
  </div>

  <script>
    let currentDate = new Date(); 
    const today = new Date(); 

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const dayLabels = ["S", "M", "T", "W", "T", "F", "S"];

    function renderCalendar(date) {
      const grid = document.getElementById("weekGrid");
      const header = document.getElementById("monthYearHeader");
      grid.innerHTML = "";

      const currentDayOfWeek = date.getDay();
      const startOfWeek = new Date(date);
      startOfWeek.setDate(date.getDate() - currentDayOfWeek);

      const middleWeekDate = new Date(startOfWeek);
      middleWeekDate.setDate(startOfWeek.getDate() + 3);
      header.textContent = `${monthNames[middleWeekDate.getMonth()]} ${middleWeekDate.getFullYear()}`;

      dayLabels.forEach(label => {
        const div = document.createElement("div");
        div.className = "day-label";
        div.textContent = label;
        grid.appendChild(div);
      });

      for (let i = 0; i < 7; i++) {
        const activeDate = new Date(startOfWeek);
        activeDate.setDate(startOfWeek.getDate() + i);

        const cell = document.createElement("div");
        cell.className = "day-cell";

        const numSpan = document.createElement("span");
        numSpan.className = "date-number";
        numSpan.textContent = String(activeDate.getDate()).padStart(2, '0');
        cell.appendChild(numSpan);

        if (activeDate.toDateString() === today.toDateString()) {
          cell.classList.add("active");
          const dot = document.createElement("div");
          dot.className = "dot-indicator";
          cell.appendChild(dot);
        }

        grid.appendChild(cell);
      }
    }

    function changeWeek(direction) {
      currentDate.setDate(currentDate.getDate() + (direction * 7));
      renderCalendar(currentDate);
    }

    renderCalendar(currentDate);
  </script>
</body>
</html>
