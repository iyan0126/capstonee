<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }

    .widget-container {
      background-color: #344955;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      border: 2px solid #000000;
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .spending-text {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .amount-highlight {
      color: #f7c155;
      font-weight: 800;
    }

    .date-stamp {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .progress-track {
      background-color: #ffffff;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(0, 0, 0, 0);
    }

    .progress-fill {
      background-color: #f7c155;
      height: 100%;
      width: 0%; 
      border-top-left-radius: 9px;
      border-bottom-left-radius: 9px;
      display: flex;
      align-items: center;
      padding-left: 16px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .percentage-spent {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .percentage-remaining {
      position: absolute;
      right: 16px;
      color: #423c2f;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    
    .loading-state {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <p class="spending-text" id="spent-text-container">
        <span class="loading-state">Fetching budget metrics...</span>
      </p>
      <span class="date-stamp" id="date-stamp">---</span>
    </div>
    
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill">
        <span class="percentage-spent" id="pct-spent">0.00%</span>
      </div>
      <span class="percentage-remaining" id="pct-remaining">100.00%</span>
    </div>
  </div>

    <script>
    const API_URL = `https://script.google.com/macros/s/AKfycbzmSA0pXfU5rj-MZm0TmsmxABrBvWv89fmJyt6xy8hNsFWNYm3zfxSvZu2yBFGAYgYXIQ/exec`; 
  
    const currentDate = new Date();
    const monthString = currentDate.toLocaleString('en-US', { month: 'short' });
    const yearString = currentDate.getFullYear();
    document.getElementById('date-stamp').textContent = `${monthString} ${yearString}`;

    async function fetchSpreadsheetData() {
    try {
      const noCacheUrl = `${API_URL}?v=${new Date().getTime()}`;
      
      const response = await fetch(noCacheUrl, {
        method: 'GET',
        mode: 'cors',
        redirect: 'follow'
      });
      
      if (!response.ok) throw new Error('API connection error');
      
      const data = await response.json();
      const totalBudget = parseFloat(data.totalBudget);
      const amountSpent = parseFloat(data.amountSpent);

      updateWidgetUI(totalBudget, amountSpent);
    } catch (error) {
      console.error('Data stream error:', error);
      document.getElementById('spent-text-container').innerHTML = 
        `<span style="color: #ff6b6b;">Syncing error... retrying</span>`;
      setTimeout(fetchSpreadsheetData, 3000);
    }
  }

  function updateWidgetUI(totalBudget, amountSpent) {
    let spentPercentage = 0;
    let remainingPercentage = 100;

    if (totalBudget > 0) {
      spentPercentage = (amountSpent / totalBudget) * 100;
      spentPercentage = Math.min(Math.max(spentPercentage, 0), 100);
      remainingPercentage = 100 - spentPercentage;
    }

    const phpFormatter = new Intl.NumberFormat('en-PH', {
      style: 'currency',
      currency: 'PHP',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    document.getElementById('spent-text-container').innerHTML = 
      `You have spent <span class="amount-highlight">${phpFormatter.format(amountSpent)}</span> this month.`;
    
    document.getElementById('progress-fill').style.width = spentPercentage.toFixed(2) + '%';
    document.getElementById('pct-spent').textContent = spentPercentage.toFixed(2) + '%';
    document.getElementById('pct-remaining').textContent = remainingPercentage.toFixed(2) + '%';
  }

  fetchSpreadsheetData();
  </script>

</body>
</html>
